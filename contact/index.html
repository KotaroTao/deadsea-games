<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ — Dead Sea Games</title>
<meta name="description" content="Dead Sea Games（株式会社ファンクション・ティ ゲーム部門）へのお問い合わせ。">
<link rel="canonical" href="https://deadsea-games.com/contact/">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="site-header compact">
  <a class="logo-link" href="../"><img src="../assets/dead-sea-games.webp" width="1200" height="400" alt="Dead Sea Games"></a>
</header>

<main>
  <section aria-labelledby="contact-title">
    <h2 id="contact-title">お問い合わせ</h2>
    <p class="lead-left">ゲームについてのご質問・不具合のご報告・その他のご連絡は、こちらからお送りください。返信は入力いただいたメールアドレスへお送りします。</p>
    <form id="contact" class="contact-form" novalidate>
      <label>お名前（任意）<input name="name" type="text" maxlength="80" autocomplete="name"></label>
      <label>メールアドレス<input name="email" type="email" maxlength="200" autocomplete="email" required></label>
      <label>お問い合わせ内容<textarea name="message" rows="8" maxlength="4000" required></textarea></label>
      <!-- 機械だけが埋める隠し欄。人には見えない -->
      <label class="hp" aria-hidden="true">ウェブサイト<input name="website" type="text" tabindex="-1" autocomplete="off"></label>
      <p class="note">入力いただいた内容は、返信と対応のためにだけ使います。詳しくは<a href="https://soulking.deadsea-games.com/legal.html#privacy">プライバシーポリシー</a>をご覧ください。パスワードなどの秘密の情報は書かないでください。</p>
      <button class="button primary" type="submit">送信する</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <p><a href="../">ホーム</a> ・ <a href="https://soulking.deadsea-games.com/legal.html">利用規約・プライバシーポリシー</a></p>
  <p>© 2026 株式会社ファンクション・ティ / Dead Sea Games</p>
</footer>
<script src="contact.js" type="module"></script>
</body>
</html>
